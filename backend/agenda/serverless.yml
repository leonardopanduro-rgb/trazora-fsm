service: trazora-agenda

provider:
  name: aws
  runtime: python3.12
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  timeout: 25
  iam:
    role: ${env:LAB_ROLE_ARN}
  environment:
    AGENDA_TABLE: trazora-agenda-${sls:stage}
    ORDENES_API_BASE: ${env:MS3_ORDENES_API_BASE}
    TECNICOS_API_BASE: ${env:MS2_TECNICOS_API_BASE}

functions:
  programar:
    handler: handler.crear
    events:
      - http:
          path: visitas
          method: post
          cors: true
          authorizer: &ms0Auth
            arn: ${env:MS0_AUTHORIZER_ARN}
            type: token
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 0

  listar:
    handler: handler.listar
    events:
      - http:
          path: visitas
          method: get
          cors: true
          authorizer: *ms0Auth

  buscar:
    handler: handler.buscar
    events:
      - http:
          path: visitas/{visita_id}
          method: get
          cors: true
          authorizer: *ms0Auth

  iniciar:
    handler: handler.iniciar
    events:
      - http:
          path: visitas/{visita_id}/iniciar
          method: post
          cors: true
          authorizer: *ms0Auth

  reprogramar:
    handler: handler.reprogramar
    events:
      - http:
          path: visitas/{visita_id}/reprogramar
          method: patch
          cors: true
          authorizer: *ms0Auth

  cancelar:
    handler: handler.cancelar
    events:
      - http:
          path: visitas/{visita_id}/cancelar
          method: post
          cors: true
          authorizer: *ms0Auth

  reservasFuturas:
    handler: handler.reservas_futuras
    events:
      - http:
          path: tecnicos/{tecnico_id}/reservas-futuras
          method: get
          cors: true
          authorizer: *ms0Auth

resources:
  Resources:
    AgendaTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.AGENDA_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

  Outputs:
    AgendaTableName:
      Value: !Ref AgendaTable
