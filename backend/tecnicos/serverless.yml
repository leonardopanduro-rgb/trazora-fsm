service: trazora-tecnicos

provider:
  name: aws
  runtime: python3.12
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  iam:
    role: ${env:LAB_ROLE_ARN}
  environment:
    TECNICOS_TABLE: trazora-tecnicos-${sls:stage}

functions:
  crear:
    handler: handler.crear
    events:
      - http:
          path: tecnicos
          method: post
          cors: true
          authorizer: &ms0Auth
            arn: ${env:MS0_AUTHORIZER_ARN}
            type: token
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 0

  listar:
    handler: handler.listar
    events:
      - http:
          path: tecnicos
          method: get
          cors: true
          authorizer: *ms0Auth

  buscar:
    handler: handler.buscar
    events:
      - http:
          path: tecnicos/{tecnico_id}
          method: get
          cors: true
          authorizer: *ms0Auth

  guardarJornada:
    handler: handler.guardar_jornada
    events:
      - http:
          path: tecnicos/{tecnico_id}/jornadas/{fecha}
          method: put
          cors: true
          authorizer: *ms0Auth

  listarJornadas:
    handler: handler.listar_jornadas
    events:
      - http:
          path: tecnicos/{tecnico_id}/jornadas
          method: get
          cors: true
          authorizer: *ms0Auth

resources:
  Resources:
    TecnicosTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.TECNICOS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
  Outputs:
    TecnicosTableName:
      Value: !Ref TecnicosTable
