service: trazora-usuarios

provider:
  name: aws
  runtime: python3.12
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  iam:
    role: ${env:LAB_ROLE_ARN}
  environment:
    USUARIOS_TABLE: trazora-usuarios-${sls:stage}
    SESIONES_TABLE: trazora-sesiones-${sls:stage}
    ALLOWED_TENANTS: CLIMALIMA,FRIOSUR,TECNINORTE

functions:
  health:
    handler: handler.health
    events:
      - http:
          path: health
          method: get
          cors: true

  login:
    handler: handler.login
    timeout: 10
    events:
      - http:
          path: auth/login
          method: post
          cors: true

  validarToken:
    handler: handler.authorizer

  me:
    handler: handler.me
    events:
      - http:
          path: usuarios/me
          method: get
          cors: true
          authorizer:
            name: validarToken
            type: token
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 0

  logout:
    handler: handler.logout
    events:
      - http:
          path: auth/logout
          method: post
          cors: true
          authorizer:
            name: validarToken
            type: token
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 0

resources:
  Resources:
    UsuariosTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.USUARIOS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

    SesionesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.SESIONES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: token_hash
            AttributeType: S
        KeySchema:
          - AttributeName: token_hash
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: expires_at
          Enabled: true

  Outputs:
    UsuariosTableName:
      Description: Nombre de la tabla de usuarios MS0
      Value: !Ref UsuariosTable
    SesionesTableName:
      Description: Nombre de la tabla de sesiones MS0
      Value: !Ref SesionesTable
